      <!-- ORDER FORM -->
  <section class="section order">

    <h2>Place Your Order</h2>
    <p class="order-subtitle">Fill in your details and we will get back to you to confirm your order.</p>

    <form class="order-form">

      <label for="name">Full name</label>
      <input type="text" id="name" placeholder="Enter your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="example@email.com" required>

      <label for="phone">Phone</label>
      <input type="tel" id="phone" placeholder="+212 6 00 00 00 00" required>

      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" min="1" placeholder="Enter the quantity" required>

      <label for="message">Message</label>
      <textarea id="message" rows="5" placeholder="Write your message here..."></textarea>

      <div class="accept">
        <input type="checkbox" id="accept" required>
        <label for="accept">I accept</label>
      </div>

      <button type="submit" class="btn form-button">Confirm order</button>

    </form>

  </section>
